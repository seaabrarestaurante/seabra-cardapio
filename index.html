let cart=[];let deliveryQuote=null;let fiscalSettings={enabled:true,allow_at_order:true,allow_at_cash:true,portal_url:'',provider_mode:'portal',issuer:{},fields:[]};let drinkSettings={refri_brands:['Coca-Cola'],juice_flavors:[]};const accomp=['Arroz','Salada de tomate','Feijão tropeiro','Feijão de caldo','Batata frita'];
function firstImg(v){return Array.isArray(v)?v[0]:v}
function render(filter=''){menu.innerHTML='';cats.innerHTML='';Object.entries(data).forEach(([cat,items])=>{let show=items.filter(x=>(x[0]+' '+x[2]).toLowerCase().includes(filter.toLowerCase()));if(!show.length)return;let b=document.createElement('button');b.textContent=cat;b.onclick=()=>document.getElementById('s-'+cat.replace(/\W/g,'')).scrollIntoView({behavior:'smooth'});cats.appendChild(b);let s=document.createElement('section');s.className='section';s.id='s-'+cat.replace(/\W/g,'');s.innerHTML='<h2>'+cat+'</h2>';show.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML=(x[3]?`<img src="${firstImg(x[3])}" alt="${x[0]}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:`<div class="ph">SEABRA<br>RESTAURANTE</div>`)+`<div><h3>${x[0]}</h3>${x[0]==='Completão'?'<span class="winner">🏆 CAMPEÃO DE VENDAS</span>':''}<div class="desc">${x[2]}</div><div class="price">${x[1]?BRL(x[1]):'Consultar'}</div></div>`;d.onclick=()=>openItem(x);s.appendChild(d)});menu.appendChild(s)})}render();q.oninput=e=>render(e.target.value);
function choiceButtons(name,values,onchange=''){
  return '<div class="choice-grid">'+values.map(a=>`<label class="choice-chip"><input type="radio" name="${name}" value="${a}" ${onchange?`onchange="${onchange}"`:''}><span>${a}</span></label>`).join('')+'</div>';
}
function toggleCompletaoPonto(){
  const prot=sheet.querySelector('input[name="prot"]:checked')?.value||'';
  const box=document.getElementById('completaoPonto');
  if(!box) return;
  box.style.display=prot==='Carne'?'block':'none';
  if(prot!=='Carne') box.querySelectorAll('input[name="ponto"]').forEach(i=>i.checked=false);
}
function openItem(x){
  let opts='';
  if(x[4]=='exec'){
    opts='<b>Escolha exatamente 3 acompanhamentos:</b>'+accomp.map(a=>`<label><input type="checkbox" name="op" value="${a}"> ${a}</label>`).join('');
    if(x[0]=='Alcatra Acebolada'){
      opts+='<b class="choice-title">Como deseja a carne?</b>'+choiceButtons('ponto',['Bem passado','Ao ponto','Mal passado']);
    }
  }
  if(x[4]=='salada') opts='<b>Escolha sua proteína:</b>'+['Frango','Carne','Peixe'].map(a=>`<label><input type="radio" name="prot" value="${a}"> ${a}</label>`).join('');
  if(x[4]=='completao'){
    opts='<b class="choice-title">Escolha a proteína:</b>'+choiceButtons('prot',['Carne','Frango'],'toggleCompletaoPonto()')+
      '<div id="completaoPonto" style="display:none"><b class="choice-title">Como deseja a carne?</b>'+choiceButtons('ponto',['Bem passado','Ao ponto','Mal passado'])+'</div>';
  }
  if(x[4]=='chapada') opts='<b>Escolha o recheio:</b><label><input type="radio" name="prot" value="Carne desfiada"> Carne desfiada</label><label><input type="radio" name="prot" value="Frango desfiado"> Frango desfiado</label>';
  if(x[4]=='burger') opts='<label><input type="checkbox" id="fries"> Adicionar batata frita + R$ 7,99</label>';
  if(x[4]=='ovo') opts='<b class="choice-title">Como deseja o ovo?</b>'+choiceButtons('ponto',['Bem passado','Ao ponto','Mal passado']);
  if(x[4]=='refri'){
    const marcas=(drinkSettings.refri_brands&&drinkSettings.refri_brands.length)?drinkSettings.refri_brands:['Coca-Cola'];
    opts='<b class="choice-title">Escolha o refrigerante:</b>'+choiceButtons('marca',marcas)+
      '<b class="choice-title">Escolha o tipo:</b>'+choiceButtons('tipo',['Normal (com açúcar)','Zero (sem açúcar)']);
  }
  if(x[4]=='suco'){
    const sabores=(drinkSettings.juice_flavors&&drinkSettings.juice_flavors.length)?drinkSettings.juice_flavors:[];
    opts=sabores.length
      ? '<b class="choice-title">Escolha o sabor:</b>'+choiceButtons('sabor',sabores)
      : '<div class="availability-note"><b>Sabores em atualização.</b><br>Consulte o restaurante sobre os sabores disponíveis.</div>';
  }
  if(x[4]=='shake'){
    opts='<div class="availability-note"><b>Consultar disponibilidade</b><br>Você pode acrescentar o shake ao carrinho. O restaurante confirmará a disponibilidade e o valor antes do pagamento.</div>';
  }
  const canAdd=!!x[1] || x[4]=='shake' || x[4]=='suco';
  sheet.innerHTML=`<button class="close" onclick="closeM()">Fechar</button>${x[3]?`<div class="prodgallery">${(Array.isArray(x[3])?x[3]:[x[3]]).map(im=>`<img src="${im}" alt="${x[0]}">`).join('')}</div>`:''}<h2>${x[0]}</h2><p class="desc">${x[2]}</p><h3>${x[1]?BRL(x[1]):'Consultar disponibilidade'}</h3>${opts}<label>Observação<textarea id="obs" placeholder="Ex.: sem cebola"></textarea></label>${canAdd?'<button onclick="add()">Adicionar ao pedido</button>':''}`;
  modal.style.display='flex';renderFiscalRequestArea();
  window.current=x;
}
function add(){
  let x=current;
  const accompChoices=[...sheet.querySelectorAll('input[name="op"]:checked')].map(i=>i.value);
  const point=sheet.querySelector('input[name="ponto"]:checked')?.value||'';
  const prot=sheet.querySelector('input[name="prot"]:checked')?.value||'';
  const marca=sheet.querySelector('input[name="marca"]:checked')?.value||'';
  const tipo=sheet.querySelector('input[name="tipo"]:checked')?.value||'';
  const sabor=sheet.querySelector('input[name="sabor"]:checked')?.value||'';

  if(x[4]=='exec'&&accompChoices.length!=3){alert('Escolha exatamente 3 acompanhamentos.');return}
  if(x[0]=='Alcatra Acebolada'&&!point){alert('Escolha o ponto da carne.');return}
  if(['salada','chapada'].includes(x[4])&&!prot){alert('Escolha uma opção.');return}
  if(x[4]=='completao'&&!prot){alert('Escolha a proteína.');return}
  if(x[4]=='completao'&&prot==='Carne'&&!point){alert('Escolha o ponto da carne.');return}
  if(x[4]=='ovo'&&!point){alert('Escolha como deseja o ovo.');return}
  if(x[4]=='refri'&&!marca){alert('Escolha o refrigerante.');return}
  if(x[4]=='refri'&&!tipo){alert('Escolha Normal ou Zero.');return}
  if(x[4]=='suco'&&drinkSettings.juice_flavors.length&&!sabor){alert('Escolha o sabor do suco.');return}

  let choices=[...sheet.querySelectorAll('input:checked')].map(i=>i.value||'Batata frita');
  let extra=sheet.querySelector('#fries')?.checked?7.99:0;
  const consult=x[4]=='shake'||x[4]=='suco'&&!x[1];
  cart.push({name:x[0],price:x[1]+extra,choices,obs:sheet.querySelector('#obs').value,consult});
  closeM();update();
}
function closeM(){modal.style.display='none'}function update(){count.textContent=cart.length;const sub=cart.reduce((s,x)=>s+x.price,0);const freight=deliveryQuote?.fee||0;total.textContent=BRL(sub+freight)}
function openCart(){
  let subtotal=cart.reduce((s,x)=>s+x.price,0);
  sheet.innerHTML=`
    <button class="close" onclick="closeM()">Fechar</button>
    <h2>Seu pedido</h2>
    ${cart.length?cart.map((x,i)=>`<div class="cartline"><div><b>${x.name}</b><div class="small">${x.choices.join(', ')} ${x.obs?'• '+x.obs:''}${x.consult?' • disponibilidade/valor a confirmar':''}</div></div><div>${x.consult?'Consultar':BRL(x.price)} <a href="#" onclick="cart.splice(${i},1);update();openCart();return false" style="color:#e77">remover</a></div></div>`).join(''):'<p>Seu carrinho está vazio.</p>'}
    <hr>
    <div class="cartline"><b>${cart.some(x=>x.consult)?'Subtotal dos itens com preço definido':'Subtotal'}</b><b>${BRL(subtotal)}</b></div>
    ${cart.some(x=>x.consult)?'<p class="small" style="color:#f1b55b">Há item com disponibilidade e valor a confirmar. Ele não está incluído neste subtotal.</p>':''}
    <p class="small">Taxa de embalagem: R$ 1,50. Serviço de quarto: R$ 3,00 quando aplicável.</p>
    ${cart.length?`
      <div style="margin:18px 0;padding:14px;border:1px solid #6f4a33;border-radius:14px;background:#1d1511">
        <b>Identificação do pedido</b>
        <label style="display:block;margin-top:12px">Nome (opcional)</label>
        <input id="customerName" type="text" placeholder="Digite o nome, se quiser" style="width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #6d584b;background:#fff;color:#222">

        <label style="display:block;margin-top:14px">Onde você quer receber ou retirar?</label>
        <select id="orderType" onchange="renderOrderFields()" style="width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #6d584b;background:#fff;color:#222">
          <option value="">Selecione uma opção</option>
          <option value="Mesa">Para comer no restaurante</option>
          <option value="Quarto">Quarto do hotel</option>
          <option value="Retirada">Para levar</option>
          <option value="Entrega" disabled>Entrega fora do hotel — temporariamente indisponível</option>
        </select>
        <div id="orderExtraFields"></div>
      </div>

      <div id="fiscalRequestArea"></div><div style="margin:16px 0"><b>Forma de pagamento</b>
        <label style="display:block;margin-top:10px"><input type="radio" name="pay" value="Pix direto"> Pix direto (QR Code / Copia e Cola)</label>
        <label style="display:block;margin-top:8px;opacity:.55"><input type="radio" name="pay" value="Cartão PagBank" disabled> Cartão pelo PagBank — temporariamente indisponível</label>
        <div class="small" style="margin:5px 0 0 24px;color:#d8c7bb">Pagamento pelo PagBank está temporariamente indisponível. A estrutura permanece pronta para reativação.</div>
        <label style="display:block;margin-top:8px"><input type="radio" name="pay" value="Pagamento na entrega" checked> Pagar na entrega/retirada</label>
      </div>
      <button onclick="checkout()">Continuar pedido</button>
    `:''}`;
  modal.style.display='flex';
}

function renderOrderFields(){
  deliveryQuote=null;update();
  const type=document.getElementById('orderType')?.value||'';
  const box=document.getElementById('orderExtraFields');
  if(!box) return;
  const inp=(id,label,ph,extra='')=>`<label style="display:block;margin-top:12px">${label}</label><input id="${id}" type="text" placeholder="${ph}" ${extra} style="width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #6d584b;background:#fff;color:#222">`;
  if(type==='Mesa') box.innerHTML=inp('tableNumber','Número da mesa','Ex.: Mesa 3');
  else if(type==='Quarto') box.innerHTML=inp('roomNumber','Número do quarto','Ex.: Quarto 204');
  else if(type==='Retirada') box.innerHTML=

function formatCEPInput(el){
  invalidateFreight();
  const digits=(el.value||'').replace(/\D/g,'').slice(0,8);
  el.value=digits.length>5?digits.slice(0,5)+'-'+digits.slice(5):digits;
  if(digits.length===8) lookupCEP();
}

async function lookupCEP(){
  const cepEl=document.getElementById('zipCode');
  if(!cepEl) return;
  const cep=(cepEl.value||'').replace(/\D/g,'');
  if(cep.length!==8){
    if(cep.length) setCEPStatus('CEP incompleto. Digite os 8 números ou preencha o endereço manualmente.','#f1b55b');
    return;
  }
  setCEPStatus('Buscando endereço...');
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`,{cache:'no-store'});
    if(!r.ok) throw new Error('Falha na consulta');
    const d=await r.json();
    if(d.erro){
      setCEPStatus('CEP não encontrado. Confira no site dos Correios ou preencha manualmente.','#ff9d8f');
      return;
    }
    const fill=(id,val)=>{const el=document.getElementById(id); if(el && val) el.value=val;};
    fill('street',d.logradouro||'');
    fill('neighborhood',d.bairro||'');
    fill('city',d.localidade||'');
    fill('state',d.uf||'');
    setCEPStatus('Endereço localizado. Confira os dados e informe o número e o complemento, se houver.','#8fd19e');
    setTimeout(()=>document.getElementById('addressNumber')?.focus(),50);
  }catch(e){
    setCEPStatus('Não foi possível consultar agora. Você pode preencher o endereço manualmente ou conferir no site dos Correios.','#ff9d8f');
  }
}

function deliveryAddressData(){
  return {
    zip_code:(document.getElementById('zipCode')?.value||'').replace(/\D/g,''),
    street:(document.getElementById('street')?.value||'').trim(),
    number:(document.getElementById('addressNumber')?.value||'').trim(),

    state:(document.getElementById('state')?.value||'').trim().toUpperCase(),

    country:'BR'
  };
}
function deliveryAddressKey(a){
  return [a.zip_code,a.street,a.number,a.neighborhood,a.city,a.state,a.complement].map(v=>(v||'').toLowerCase().trim()).join('|');
}
async function calculateFreight(){
  const a=deliveryAddressData();
  if(a.zip_code.length!==8||!a.street||!a.number||!a.city||!a.state){
    const faltando=[];
    if(a.zip_code.length!==8) faltando.push('CEP');
    if(!a.street) faltando.push('rua');
    if(!a.number) faltando.push('número');
    if(!a.city) faltando.push('cidade');
    if(!a.state) faltando.push('UF');
    setFreightStatus('Falta preencher: '+faltando.join(', ')+'.','#ff9d8f');
    return;
  }
  const btn=document.getElementById('freightButton');
  if(btn){btn.disabled=true;btn.textContent='Calculando...';}
  setFreightStatus('Consultando a entrega...');
  deliveryQuote=null;update();
  try{
    const dropoffAddress=[a.street+', '+a.number,a.neighborhood,a.city+' - '+a.state,a.zip_code].filter(Boolean).join(', ');
    const r=await fetch('https://seabra-uber-direct.seabrarestauranteba-27c.workers.dev/quote',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        dropoff:a,
        dropoff_address:dropoffAddress,
        dropoff_structured:{
          street_address:[a.street+', '+a.number,[a.neighborhood,a.complement].filter(Boolean).join(' - ')],
          city:a.city,
          state:a.state,
          zip_code:a.zip_code,
          country:'BR'
        }
      })
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      let msg=d.message||d.erro||d.error||'Não foi possível obter a cotação agora.';
      if(d.status_uber) msg+=` (Uber ${d.status_uber})`;
      if(d.detalhe){
        const det=typeof d.detalhe==='string'?d.detalhe:JSON.stringify(d.detalhe);
        if(det&&det!=='{}') msg+=` — ${det.slice(0,220)}`;
      }
      setFreightStatus(msg,'#ffb38f');
      return;
    }
    const rawFee=d.fee_cents??d.fee??d.amount??d.price;
    const feeNumber=Number(rawFee);
    if(!Number.isFinite(feeNumber)||feeNumber<=0){
      setFreightStatus('A Uber respondeu, mas não retornou um valor de frete válido. Tente novamente.','#ffb38f');
      return;
    }
    const feeBRL=(d.fee_cents!=null || (Number.isInteger(feeNumber)&&feeNumber>=100)) ? feeNumber/100 : feeNumber;
    deliveryQuote={
      fee:feeBRL,
      currency:d.currency||'BRL',
      quote_id:d.quote_id||d.id||'',
      expires:d.expires||d.expires_at||'',
      duration:d.duration||d.duration_minutes||null,
      addressKey:deliveryAddressKey(a),
      source:d.source||'uber_direct'
    };
    let extra=deliveryQuote.duration?` • previsão aproximada: ${deliveryQuote.duration} min`:'';
    if(d.source==='fallback') extra+=' • valor de contingência';
    setFreightStatus(`Frete: ${BRL(deliveryQuote.fee)}${extra}.`, '#8fd19e');
    update();
  }catch(e){
    setFreightStatus('A cotação automática não respondeu. O pedido poderá seguir com o frete a confirmar pelo restaurante.','#ffb38f');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Calcular frete';}
  }
}
function deliveryFreightFor(a){
  if(!deliveryQuote) return null;
  if(deliveryQuote.addressKey!==deliveryAddressKey(a)) return null;
  return deliveryQuote;
}

function getOrderDestination(){

  const name=rawName||'Cliente';

  }
  if(type==='Retirada'){

    return {name,type,phone,details:`Para levar • Apto. ${apartment} • ${block} • WhatsApp: ${phone}`,meta:{phone,apartment,block}};
  }
  const cep=(document.getElementById('zipCode')?.value||'').trim();
  const rua=(document.getElementById('street')?.value||'').trim();
  const numero=(document.getElementById('addressNumber')?.value||'').trim();
  const bairro=(document.getElementById('neighborhood')?.value||'').trim();

  const uf=(document.getElementById('state')?.value||'').trim().toUpperCase();
  const comp=(document.getElementById('complement')?.value||'').trim();
  if(!cep||!rua||!numero||!bairro||!cidade||!uf){alert('Para entrega, preencha CEP, rua, número, bairro, cidade e UF.');return null;}
  const address={zip_code:cep.replace(/\D/g,''),street:rua,number:numero,neighborhood:bairro,city:cidade,state:uf,complement:comp,country:'BR'};
  const freight=deliveryFreightFor(address);
  return {name,type,address,freight,details:`Entrega: ${rua}, nº ${numero} - ${bairro} - ${cidade}/${uf} - CEP ${cep}${comp?` - ${comp}`:''}`,meta:{phone:''}};
}

let pixCurrentPayload='';

function pixTLV(id,value){
  value=String(value);
  return id+String(value.length).padStart(2,'0')+value;
}
function pixNormalize(value,max){
  return String(value||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9 .-]/g,'')
    .toUpperCase().trim().slice(0,max);
}
function pixCRC16(payload){
  let crc=0xFFFF;
  for(let i=0;i<payload.length;i++){
    crc^=payload.charCodeAt(i)<<8;
    for(let j=0;j<8;j++) crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);
    crc&=0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function generatePixPayload(amount){
  const merchantAccount=pixTLV('00','BR.GOV.BCB.PIX')+pixTLV('01',PIX_KEY);
  const additional=pixTLV('05','***');
  let payload='';
  payload+=pixTLV('00','01');
  payload+=pixTLV('26',merchantAccount);
  payload+=pixTLV('52','0000');
  payload+=pixTLV('53','986');
  payload+=pixTLV('54',Number(amount).toFixed(2));
  payload+=pixTLV('58','BR');
  payload+=pixTLV('59',pixNormalize(PIX_MERCHANT_NAME,25));
  payload+=pixTLV('60',pixNormalize(PIX_MERCHANT_CITY,15));
  payload+=pixTLV('62',additional);
  payload+='6304';
  return payload+pixCRC16(payload);
}

      <div class="cartline"><span>Previsão inicial de preparo</span><b>${order.estimate_text||'25–35 min'}</b></div>
    </div>
    <p style="font-weight:700">Seu pedido foi identificado. Guarde o número <span style="color:${meta.color}">${orderGeneralCode(order)}</span>.</p>
    ${extraMessage?`<p class="small">${extraMessage}</p>`:''}
    ${whatsText?`<button type="button" onclick="openCurrentWhatsApp()" style="margin-top:10px;background:#198754">Enviar pedido ao restaurante no WhatsApp</button>`:''}
    <button type="button" onclick="openCart()" style="margin-top:10px">Voltar ao carrinho</button>
  `;
  modal.style.display='flex';
}

function savePendingPagBankOrder(order,dest){
  try{localStorage.setItem('seabraPendingPagBankOrder',JSON.stringify({order,dest,createdAt:Date.now()}));}catch(e){}
}
function readPendingPagBankOrder(){
  try{
    const raw=localStorage.getItem('seabraPendingPagBankOrder');
    if(!raw) return null;
    const data=JSON.parse(raw);
    if(!data?.order||!data?.dest) return null;
    return data;
  }catch(e){return null;}
}
function clearPendingPagBankOrder(){try{localStorage.removeItem('seabraPendingPagBankOrder');}catch(e){}}
function maybeShowPagBankReturn(){
  const params=new URLSearchParams(location.search);
  if(params.get('pagamento')!=='retorno') return;
  const pending=readPendingPagBankOrder();
  if(!pending) return;
  setTimeout(()=>{
    const text=buildWhatsText('Cartão PagBank — confirmar status do pagamento',pending.dest,pending.order);
    showOrderConfirmation(pending.order,pending.dest,'Cartão PagBank',text,'Você retornou do PagBank. O restaurante deve confirmar o status do pagamento.');
    clearPendingPagBankOrder();
  },250);
}

const WEATHER_LAT=-12.2664, WEATHER_LON=-38.9663;
function weatherLabel(code){const m={0:'Céu limpo',1:'Predominantemente limpo',2:'Parcialmente nublado',3:'Nublado',45:'Neblina',48:'Neblina',51:'Garoa leve',53:'Garoa',55:'Garoa forte',61:'Chuva leve',63:'Chuva',65:'Chuva forte',80:'Pancadas leves',81:'Pancadas',82:'Pancadas fortes',95:'Trovoada'};return m[Number(code)]||'Condição não classificada'}
async function captureWeather(){try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,weather_code&timezone=America%2FBahia`;const r=await fetch(u);const d=await r.json();if(!r.ok||!d.current)return null;return {temperature:Number(d.current.temperature_2m),code:Number(d.current.weather_code),condition:weatherLabel(d.current.weather_code),captured_at:d.current.time||''}}catch(e){return null}}
let lastCapturedWeather=null;
async function ensureWeather(){if(lastCapturedWeather)return lastCapturedWeather;lastCapturedWeather=await captureWeather();return lastCapturedWeather}

async function loadFiscalSettings(){try{const r=await fetch(PAGBANK_WORKER_URL+'/fiscal-settings'),d=await r.json();if(r.ok&&d.ok&&d.settings)fiscalSettings=d.settings}catch(e){}}
function renderFiscalRequestArea(){
 const box=document.getElementById('fiscalRequestArea');if(!box)return;
 if(!fiscalSettings.enabled||!fiscalSettings.allow_at_order){box.innerHTML='';return}
 box.innerHTML=`<div class="fiscal-box"><label style="font-weight:800"><input id="wantFiscal" type="checkbox" onchange="toggleFiscalFields()"> Solicitar nota fiscal</label><div class="fiscal-note">Você pode adiantar os dados agora ou informar no Caixa na hora do pagamento.</div><div id="fiscalFieldsBox" style="display:none"></div></div>`;
}
function toggleFiscalFields(){let a=document.getElementById('fiscalFieldsBox'),on=document.getElementById('wantFiscal')?.checked;if(!a)return;a.style.display=on?'block':'none';if(!on){a.innerHTML='';return}let fs=(fiscalSettings.fields||[]).filter(x=>x.enabled);a.innerHTML='<div class="fiscal-fields">'+fs.map(f=>`<div><label>${f.label}${f.required?' *':''}</label>${f.key==='observacoes'?`<textarea id="fiscal_${f.key}" rows="2"></textarea>`:`<input id="fiscal_${f.key}" type="text">`}</div>`).join('')+'</div>'}
function getFiscalRequest(){let requested=!!document.getElementById('wantFiscal')?.checked;if(!requested)return{requested:false,data:{}};let data={};for(const f of(fiscalSettings.fields||[]).filter(x=>x.enabled)){let v=(document.getElementById('fiscal_'+f.key)?.value||'').trim();if(f.required&&!v){alert('Preencha o campo fiscal obrigatório: '+f.label);return null}data[f.key]=v}return{requested:true,data}}
async function loadDrinkSettings(){
  try{
    const r=await fetch(PAGBANK_WORKER_URL+'/drink-settings');
    const d=await r.json();
    if(r.ok&&d.ok&&d.settings){
      drinkSettings={
        refri_brands:Array.isArray(d.settings.refri_brands)&&d.settings.refri_brands.length?d.settings.refri_brands:['Coca-Cola'],
        juice_flavors:Array.isArray(d.settings.juice_flavors)?d.settings.juice_flavors:[]
      };
    }
  }catch(e){}
}
async function loadDailySpecial(){try{const r=await fetch(PAGBANK_WORKER_URL+'/daily-special');const d=await r.json();if(!r.ok||!d.ok||!d.special||!d.special.enabled)return;const s=d.special,b=document.getElementById('dailySpecialBanner');b.innerHTML=`${s.image?`<img src="${s.image}" alt="${s.name}">`:''}<div><div class="special-kicker">🍽️ PRATO DO DIA / DESTAQUE DA SEMANA</div><div class="special-title">${s.name}</div><div class="desc">${s.description||''}</div><div class="special-price">${BRL(Number(s.price||0))}</div></div>`;b.classList.add('show')}catch(e){}}

async function pagBankOrderPayload(dest,order=null){
  const subtotal=cart.reduce((s,x)=>s+x.price,0);
  const freight=(dest.type==='Entrega'&&dest.freight)?dest.freight.fee:0;
  const totalFinal=subtotal+freight;
  const referenceId=order?`SEABRA-${order.day.replace(/-/g,'')}-${orderPad(order.general_number)}`:'SEABRA-'+Date.now();

  const weather=await ensureWeather();
  return {
    reference_id: referenceId,
    weather,
    fiscal:fiscalReq,
    restaurant: 'Seabra Restaurante',
    order_identity: order?{day:order.day,general_number:order.general_number,origin_number:order.origin_number,origin_type:order.origin_type,origin_code:order.origin_code,created_at_local:order.created_at_local}:null,
    customer: {name: dest.name, phone: dest.phone||''},
    destination: {
      type: dest.type,
      details: dest.details,
      address: dest.address || null, meta: dest.meta||null
    },
    items: cart.map((x,i)=>({
      reference_id: String(i+1),
      name: x.name,
      image:firstImg(x.img||''),
      description: [
        x.choices && x.choices.length ? 'Opções: '+x.choices.join(', ') : '',
        x.obs ? 'Obs.: '+x.obs : ''
      ].filter(Boolean).join(' | '),
      quantity: 1,
      unit_amount: Math.round(Number(x.price||0)*100)
    })),
    subtotal_cents: Math.round(subtotal*100),
    freight_cents: Math.round(freight*100),
    total_cents: Math.round(totalFinal*100),
    currency: 'BRL',
    return_url: window.location.origin + window.location.pathname + '?pagamento=retorno',
    notification_url_hint: 'pagbank-webhook'
  };
}

async function payWithPagBank(dest,order){
  if(dest.type==='Entrega'&&!dest.freight){
    alert('Para pagar com cartão, calcule primeiro o frete para que o PagBank receba o valor total correto.');
    return;
  }
  if(!cart.length){
    alert('Seu carrinho está vazio.');
    return;
  }

  const btns=[...document.querySelectorAll('button')];
  const continueBtn=btns.find(b=>b.textContent.trim()==='Continuar pedido');
  const originalText=continueBtn?.textContent || '';
  if(continueBtn){
    continueBtn.disabled=true;
    continueBtn.textContent='Abrindo PagBank...';
  }

  try{
    const response=await fetch(PAGBANK_WORKER_URL+'/checkout',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(await pagBankOrderPayload(dest,order))
    });

    const data=await response.json().catch(()=>({}));

    if(!response.ok || !data.ok){
      throw new Error(data.message || data.erro || 'Não foi possível iniciar o pagamento no PagBank.');
    }

    const paymentUrl =
      data.payment_url ||
      data.checkout_url ||
      data.url ||
      (Array.isArray(data.links)
        ? (data.links.find(l=>String(l.rel||'').toUpperCase()==='PAY')?.href || '')
        : '');

    if(!paymentUrl){
      throw new Error('O PagBank não devolveu o link de pagamento.');
    }

    savePendingPagBankOrder(order,dest);
    window.location.href=paymentUrl;
  }catch(error){
    alert('Pagamento por cartão indisponível no momento. '+(error?.message||'Tente novamente.'));
  }finally{
    if(continueBtn){
      continueBtn.disabled=false;
      continueBtn.textContent=originalText || 'Continuar pedido';
    }
  }
}

async function checkout(){
  const selectedType=document.getElementById('destType')?.value||'';
  const selectedPay=document.querySelector('input[name="pay"]:checked')?.value||'';
  if(selectedType==='Entrega'){
    alert('Entrega fora do restaurante está temporariamente indisponível.');
    return;
  }
  if(selectedPay==='Cartão PagBank'){
    alert('Pagamento por cartão via PagBank está temporariamente indisponível.');
    return;
  }

  const fiscalReq=getFiscalRequest();if(fiscalReq===null)return;
  let p=document.querySelector('input[name=pay]:checked')?.value||'Pagamento na entrega';
  let dest=getOrderDestination();
  if(!dest) return;

  if((p==='Pix direto'||p==='Cartão PagBank')&&cart.some(x=>x.consult)){
    alert('Há item com disponibilidade e valor a confirmar no carrinho. Para pagar online, aguarde a confirmação do restaurante ou remova esse item.');
    return;
  }

  if(p==='Pix direto'){
    if(dest.type==='Entrega'&&!dest.freight){
      alert('Para pagar por Pix, calcule primeiro o frete para que o QR Code seja gerado com o valor total correto.');
      return;
    }
    showPixPayment(dest);
    return;
  }

  if(p==='Cartão PagBank'){
    if(dest.type==='Entrega'&&!dest.freight){
      alert('Para pagar com cartão, calcule primeiro o frete para que o PagBank receba o valor total correto.');
      return;
    }
    try{
      const order=await reserveOrderIdentity(dest);
      await payWithPagBank(dest,order);
    }catch(error){
      alert('Não foi possível numerar o pedido. '+(error?.message||'Tente novamente.'));
    }
    return;
  }

  if(dest.type==='Entrega'&&!dest.freight){
    const ok=confirm('O frete ainda não foi calculado. Deseja enviar o pedido mesmo assim para o restaurante confirmar o valor da entrega pelo WhatsApp?');
    if(!ok) return;
  }
  await sendWhats(p,dest);
}


async function registerOrderForInternalPanel(dest,order,pay){
  if(ORDER_SEQUENCE_DEMO) return {ok:true,demo:true};
  const subtotal=cart.reduce((s,x)=>s+x.price,0);
  const freight=(dest.type==='Entrega'&&dest.freight)?dest.freight.fee:0;
  const totalFinal=subtotal+freight;
  const payload={
    order_identity:{
      day:order.day,
      general_number:order.general_number,
      origin_number:order.origin_number,
      origin_type:order.origin_type,
      origin_code:order.origin_code,
      created_at_local:order.created_at_local
    },
    customer:{name:dest.name,phone:dest.phone||''},
    destination:{type:dest.type,details:dest.details,address:dest.address||null,meta:dest.meta||null},
    weather:await ensureWeather(),
    items:cart.map((x,i)=>({
      reference_id:String(i+1),
      image:x.img||'',
      name:x.name,
      description:[x.choices&&x.choices.length?'Opções: '+x.choices.join(', '):'',x.obs?'Obs.: '+x.obs:''].filter(Boolean).join(' | '),
      quantity:1,
      unit_amount:Math.round(Number(x.price||0)*100)
    })),
    subtotal_cents:Math.round(subtotal*100),
    freight_cents:Math.round(freight*100),
    total_cents:Math.round(totalFinal*100),
    fiscal:fiscalReq,
    payment_method:pay
  };
  const response=await fetch(PAGBANK_WORKER_URL+'/orders',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.ok) throw new Error(data.erro||'Não foi possível registrar o pedido no painel interno.');
  return data;
}

async function sendWhats(pay='Pagamento na entrega',dest=null,order=null){
  if(!dest){dest=getOrderDestination(); if(!dest) return;}
  try{
    const identity=order||await reserveOrderIdentity(dest);
    let painelOk=true;
    try{await registerOrderForInternalPanel(dest,identity,pay)}catch(regError){painelOk=false;console.error('Falha ao registrar no painel interno:',regError)}
    const t=buildWhatsText(pay,dest,identity);
    showOrderConfirmation(identity,dest,pay,t,painelOk?'Pedido registrado no painel interno do restaurante.':'Atenção: o painel interno não confirmou o registro. O pedido ainda pode ser enviado ao restaurante pelo WhatsApp.');
  }catch(error){
    alert('Não foi possível gerar o número do pedido. O pedido não foi enviado para evitar duplicidade. '+(error?.message||'Tente novamente.'));
  }
}
