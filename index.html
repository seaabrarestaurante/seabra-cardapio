<script data-seabra-module="menu-promos-f108.js">
/* Public menu and management controls for beverages and promotions. */
window.SeabraMenuConfig = (() => {
  'use strict';
  const drinkLabels = Object.freeze({ normal: 'Normal (com açúcar)', zero: 'Zero (sem açúcar)' });
  const allTypes = Object.keys(drinkLabels);
  const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const cleanList = list => [...new Set((Array.isArray(list) ? list : [])
    .filter(value => typeof value === 'string')
    .map(value => value.replace(/[<>]/g, '').trim().slice(0, 80)).filter(Boolean))].slice(0, 100);

  function normalizeDrinks(raw = {}) {
    const brands = cleanList(raw.refri_brands);
    if (!brands.length) brands.push('Coca-Cola');
    const variants = raw.refri_variants && typeof raw.refri_variants === 'object' ? raw.refri_variants : {};
    return {
      refri_brands: brands,
      refri_variants: Object.fromEntries(brands.map(brand => [
        brand,
        Array.isArray(variants[brand]) && variants[brand].some(type => allTypes.includes(type))
          ? allTypes.filter(type => variants[brand].includes(type))
          : [...allTypes]
      ])),
      juice_flavors: cleanList(raw.juice_flavors),
      juice_price: 8,
      juice_milk_fee_cents: Number.isSafeInteger(Number(raw.juice_milk_fee_cents))
        ? Math.max(0, Math.min(100000, Number(raw.juice_milk_fee_cents))) : 0
    };
  }

  function typesFor(settings, brand) {
    const normalized = normalizeDrinks(settings);
    return normalized.refri_brands.includes(brand) ? normalized.refri_variants[brand] : [];
  }

  function radioChoices(name, values, options = {}) {
    const handler = options.onchange ? ' onchange="' + options.onchange + '"' : '';
    return '<div class="choice-grid">' + values.map(value =>
      '<label class="choice-chip"><input type="radio" name="' + name + '" value="' + escapeHtml(value) + '"' +
      ((options.checkedValue === value || (options.selectOnly && values.length === 1)) ? ' checked' : '') + handler + '><span>' +
      escapeHtml(value) + '</span></label>').join('') + '</div>';
  }

  function refriMarkup(settings) {
    const drinks = normalizeDrinks(settings);
    return '<b class="choice-title">Escolha o refrigerante:</b>' +
      radioChoices('marca', drinks.refri_brands, { onchange: 'SeabraMenuConfig.updateRefriTypes(this,drinkSettings)' }) +
      '<div data-seabra-refri-types><div class="availability-note">Escolha a marca para ver os tipos disponíveis.</div></div>';
  }

  function updateRefriTypes(input, settings) {
    const box = input.closest('#sheet')?.querySelector('[data-seabra-refri-types]') || document.querySelector('[data-seabra-refri-types]');
    if (!box) return;
    const values = typesFor(settings, input.value).map(type => drinkLabels[type]);
    box.innerHTML = values.length ? '<b class="choice-title">Tipo disponível:</b>' + radioChoices('tipo', values, { selectOnly: true }) : '';
  }

  function allowedRefriType(settings, brand, label) {
    return typesFor(settings, brand).some(type => drinkLabels[type] === label);
  }

  function juiceMarkup(settings) {
    const drinks = normalizeDrinks(settings), flavors = drinks.juice_flavors;
    const flavorMarkup = flavors.length ? '<b class="choice-title">Escolha o sabor:</b>' + radioChoices('sabor', flavors)
      : '<div class="availability-note">Os sabores disponíveis ainda serão informados pelo restaurante.</div>';
    const fee = drinks.juice_milk_fee_cents ? ' (+ ' + (drinks.juice_milk_fee_cents / 100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) + ')' : '';
    return flavorMarkup + '<b class="choice-title">Adicionar leite?</b>' + radioChoices('leite', ['Não','Sim'], {checkedValue:'Não'}) +
      '<div class="field-note">Taxa de leite configurada pelo restaurante' + fee + '.</div>';
  }

  function refriAdminMarkup(settings) {
    const drinks = normalizeDrinks(settings);
    return drinks.refri_brands.map((brand, index) =>
      '<div class="seabra-drink-variant"><b>' + escapeHtml(brand) + '</b>' +
      allTypes.map(type => '<label><input type="checkbox" data-brand-index="' + index + '" data-refri-type="' + type +
        '" onchange="SeabraMenuConfig.toggleAdminVariant(this,drinkSettings)"' + (drinks.refri_variants[brand].includes(type) ? ' checked' : '') +
        '> ' + (type === 'normal' ? 'Com açúcar' : 'Sem açúcar') + '</label>').join('') +
      '<button class="btn secondary" type="button" aria-label="Remover ' + escapeHtml(brand) +
      '" onclick="removeDrinkOption(\'refri\',' + index + ')">Remover</button></div>').join('');
  }

  function toggleAdminVariant(input, settings) {
    const drinks = normalizeDrinks(settings);
    const brand = drinks.refri_brands[Number(input.dataset.brandIndex)];
    const type = input.dataset.refriType;
    if (!brand || !allTypes.includes(type)) return;
    const choices = new Set(drinks.refri_variants[brand]);
    if (input.checked) choices.add(type);
    else choices.delete(type);
    if (!choices.size) {
      input.checked = true;
      alert('Mantenha pelo menos um tipo para esta marca ou remova a marca.');
      return;
    }
    settings.refri_variants = { ...drinks.refri_variants, [brand]: allTypes.filter(value => choices.has(value)) };
    const chips = input.closest('.seabra-drink-variant');
    chips?.querySelectorAll('input[data-refri-type]').forEach(box => { box.checked = choices.has(box.dataset.refriType); });
  }

  const safeImage = value => typeof value === 'string' && value.length <= 360000 &&
    /^data:image\/(?:jpeg|png|webp);base64,[a-z0-9+/]+={0,2}$/i.test(value);

  function renderPublicPromotion(host, banner) {
    if (!host || !banner?.enabled || (!banner.title && !banner.text && !safeImage(banner.image))) return;
    const title = host.querySelector('[data-promo-title]');
    const message = host.querySelector('[data-promo-text]');
    const photo = host.querySelector('[data-promo-image]');
    title.textContent = banner.title || '';
    title.hidden = !banner.title;
    message.textContent = banner.text || '';
    message.hidden = !banner.text;
    if (safeImage(banner.image)) {
      photo.hidden = false;
      photo.src = banner.image;
      photo.onerror = () => { photo.hidden = true; };
    }
    host.querySelector('[data-promo-close]').onclick = () => { host.hidden = true; };
    host.hidden = false;
  }

  async function showPromotion(workerUrl) {
    const host = document.getElementById('promotionBanner');
    if (!host) return;
    try {
      const response = await fetch(workerUrl + '/promotion-banner?active=1', { cache: 'no-store' });
      if (!response.ok) return;
      const result = await response.json();
      if (result.ok) renderPublicPromotion(host, result.banner);
    } catch (_) {
      /* The regular menu remains available if a promotion cannot be loaded. */
    }
  }

  async function preparePromotionImage(file) {
    if (!file || !/^image\/(?:jpeg|png|webp)$/i.test(file.type) || file.size > 12 * 1024 * 1024) {
      throw Error('Escolha uma foto JPG, PNG ou WebP de até 12 MB.');
    }
    const source = URL.createObjectURL(file);
    try {
      const photo = new Image();
      const loaded = new Promise((resolve, reject) => {
        photo.onload = resolve;
        photo.onerror = () => reject(Error('Não consegui abrir a foto escolhida.'));
      });
      photo.src = source;
      await loaded;
      const ratio = Math.min(1, 960 / Math.max(photo.naturalWidth, photo.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(photo.naturalWidth * ratio));
      canvas.height = Math.max(1, Math.round(photo.naturalHeight * ratio));
      const ctx = canvas.getContext('2d');
      if (!ctx) throw Error('O navegador não conseguiu preparar a imagem.');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(photo, 0, 0, canvas.width, canvas.height);
      for (const quality of [.82, .68, .55, .4]) {
        const encoded = canvas.toDataURL('image/jpeg', quality);
        if (safeImage(encoded)) return encoded;
      }
      throw Error('A imagem ficou muito grande. Escolha uma foto menor.');
    } finally {
      URL.revokeObjectURL(source);
    }
  }

  function mountPromotionAdmin(api) {
    const form = document.getElementById('promotionBannerForm');
    if (!form || form.dataset.bound) return;
    form.dataset.bound = '1';
    const fields = form.elements;
    const preview = form.querySelector('[data-promo-preview]');
    const status = form.querySelector('[data-promo-status]');
    let image = '';
    let ready = false;
    let imageRequest = 0;
    const setStatus = (message, error = false) => { status.textContent = message; status.dataset.error = error ? '1' : '0'; };
    const showImage = value => {
      image = safeImage(value) ? value : '';
      preview.hidden = !image;
      if (image) preview.src = image;
      else preview.removeAttribute('src');
    };
    const populate = (banner = {}) => {
      fields.enabled.checked = banner.enabled === true;
      ['title', 'text', 'start_date', 'start_time', 'end_date', 'end_time'].forEach(name => {
        fields[name].value = banner[name] || '';
      });
      showImage(banner.image);
    };
    fields.imageFile.addEventListener('change', async () => {
      const file = fields.imageFile.files?.[0];
      if (!file) return;
      const request = ++imageRequest;
      fields.saveBanner.disabled = true;
      setStatus('Preparando a foto…');
      try {
        const value = await preparePromotionImage(file);
        if (request === imageRequest) {
          showImage(value);
          setStatus('Foto pronta. Salve o banner para aplicar.');
        }
      } catch (error) {
        if (request === imageRequest) setStatus(error.message, true);
      } finally {
        if (request === imageRequest) {
          fields.imageFile.value = '';
          fields.saveBanner.disabled = !ready;
        }
      }
    });
    fields.removeBannerImage.addEventListener('click', () => {
      ++imageRequest;
      fields.imageFile.value = '';
      fields.saveBanner.disabled = !ready;
      showImage('');
      setStatus('Foto removida da edição. Salve para aplicar.');
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!ready || fields.saveBanner.disabled) return;
      const banner = Object.fromEntries(['title', 'text', 'start_date', 'start_time', 'end_date', 'end_time'].map(name => [name, fields[name].value.trim()]));
      banner.enabled = fields.enabled.checked;
      banner.image = image;
      fields.saveBanner.disabled = true;
      try {
        const result = await api('/promotion-banner', { method: 'PATCH', body: JSON.stringify(banner) });
        if (!result?.ok) throw Error(result?.erro || 'Não foi possível salvar o banner.');
        populate(result.banner);
        setStatus(banner.enabled ? 'Banner salvo. Ele aparece conforme o período escolhido.' : 'Banner salvo e oculto no cardápio.');
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        fields.saveBanner.disabled = false;
      }
    });
    async function load() {
      try {
        setStatus('Carregando a promoção…');
        const result = await api('/promotion-banner');
        if (!result?.ok) throw Error(result?.erro || 'Não foi possível carregar o banner.');
        populate(result.banner);
        ready = true;
        fields.bannerControls.disabled = false;
        fields.saveBanner.disabled = false;
        fields.reloadBanner.hidden = true;
        setStatus('');
      } catch (error) {
        fields.reloadBanner.hidden = false;
        setStatus(error.message, true);
      }
    }
    fields.reloadBanner.addEventListener('click', load);
    void load();
  }

  return { normalizeDrinks, refriMarkup, updateRefriTypes, allowedRefriType, juiceMarkup,
    refriAdminMarkup, toggleAdminVariant, showPromotion, mountPromotionAdmin };
})();

</script>

    <strong data-service-title>Consultando horário de atendimento</strong>

<script data-seabra-module="f111-calendar-public">
'use strict';

const SeabraScheduledCheckout = (function installSeabraScheduledCheckout() {
  const field = part => document.getElementById('seabraSchedule' + part);
  const supported = new Set(['Mesa', 'Balcao', 'Quarto', 'Retirada']);
  const destinationModes = new WeakMap();
  const timePattern = /^(?:[01]\d|2[0-3]):[0-5]\d$/;
  const dayFormatter = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Bahia', year: 'numeric', month: '2-digit', day: '2-digit' });
  let worker;
  let availability = 'checking';
  let enabled = false;
  let minimumDay = '';
  let latest;

  function validDay(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const day = new Date(value + 'T00:00:00Z');
    return Number.isFinite(day.valueOf()) && day.toISOString().slice(0, 10) === value;
  }

  function typeSupported(value) {
    return supported.has(value);
  }

  function connect(origin) {
    worker = origin;
  }

  function acceptsWhileClosed() {
    return availability === 'closed' && enabled;
  }

  function setText(element, value) {
    if (element.textContent !== value) element.textContent = value;
  }

  function render() {
  const fields = field('Fields');
  const select = document.getElementById('orderType');
  if (!fields || !select) return;
  const mode = field('Mode');
  const required = acceptsWhileClosed();
  fields.hidden = !enabled && mode.value !== 'later';
  mode.options[0].disabled = required;
  mode.options[1].disabled = !enabled;
  if (required) mode.value = 'later';
  const scheduled = mode.value === 'later';
  field('Details').hidden = !scheduled || !enabled;
  field('Day').min = minimumDay;
  setText(field('Instruction'), !enabled && scheduled
    ? 'O agendamento ficou indisponível. Selecione Pedir agora para continuar.'
    : required ? 'O restaurante está fechado agora. Escolha a data e o horário do pedido.' : '');

  let previous = destinationModes.get(select);
  if (!previous) {
    previous = {options:Array.from(select.options, option=>option.cloneNode(true)), scheduled:false, immediate:select.value};
    destinationModes.set(select, previous);
  }
  if (scheduled !== previous.scheduled) {
    const oldValue = select.value;
    previous.scheduled = scheduled;
    if (scheduled) {
      previous.immediate = oldValue;
      const placeholder = new Option('Escolha a modalidade do pedido', '');
      placeholder.disabled = true;
      select.replaceChildren(placeholder, ...previous.options.filter(option=>typeSupported(option.value)).map(option=>option.cloneNode(true)));
      select.value = typeSupported(oldValue) ? oldValue : '';
    } else {
      select.replaceChildren(...previous.options.map(option=>option.cloneNode(true)));
      select.value = previous.immediate;
    }
    if (oldValue !== select.value) renderOrderFields();
  }

  const payments = document.getElementById('seabraImmediatePayments');
  if (payments) {
    payments.hidden = scheduled;
    payments.disabled = scheduled;
  }
  const checkoutButton = document.getElementById('seabraMainCheckout');
  if (checkoutButton && !seabraScheduledSubmitBusy) setText(checkoutButton, scheduled ? 'Gerar Pix do agendamento' : 'Continuar pedido');
  const phone = document.getElementById('customerPhone') || document.getElementById('roomPhone') || document.getElementById('takePhone') || document.getElementById('deliveryPhone');
  const selectedType = document.getElementById('orderType')?.value || '';
  if (phone) phone.required = seabraWhatsAppRequired(selectedType);
  const whatsappForm = seabraWhatsAppPixForms.get(document.getElementById('seabraWhatsAppStatusOptIn'));
  if (whatsappForm && whatsappForm.scheduled !== scheduled) {
    whatsappForm.scheduled = scheduled;
    renderSeabraWhatsAppPixForm(whatsappForm);
  }
}

  function update(state, canSchedule, serverNow) {
    availability = state;
    enabled = canSchedule === true && (state === 'open' || state === 'closed');
    const date = typeof serverNow === 'string' ? new Date(serverNow) : new Date();
    if (Number.isFinite(date.valueOf())) minimumDay = dayFormatter.format(date);
    render();
  }

  async function loadSlots() {
    const date = field('Day');
    const select = field('Time');
    if (!worker || !date || !select) return;
    latest?.abort.abort();
    latest = null;
    const day = date.value;
    const status = field('Status');
    const retry = field('Retry');
    const selectedTime = select.dataset.day === day ? select.value : '';
    select.replaceChildren(new Option(day ? 'Selecione um horário' : 'Escolha primeiro a data', ''));
    select.disabled = true;
    delete select.dataset.day;
    retry.hidden = true;
    setText(status, '');
    if (!day || !enabled) return;
    if (!validDay(day) || day < minimumDay) {
      setText(status, 'Escolha hoje ou uma data futura.');
      return;
    }
    const abort = new AbortController();
    const pending = { abort };
    latest = pending;
    setText(status, 'Consultando horários…');
    const timeout = setTimeout(() => abort.abort(), 8000);
    try {
      const url = new URL('/service-calendar/slots', worker);
      url.searchParams.set('day', day);
      const response = await fetch(url, { cache: 'no-store', signal: abort.signal });
      const result = await response.json();
      if (latest !== pending || field('Day') !== date || date.value !== day) return;
      if (!response.ok || result?.ok !== true || result.day !== day) throw Error('Horários indisponíveis');
      const times = [...new Set(Array.isArray(result.slots) ? result.slots.filter(time => typeof time === 'string' && timePattern.test(time)) : [])].sort();
      if (result.enabled !== true || !enabled || !times.length) {
        setText(status, result.enabled === true ? 'Nenhum horário disponível nesta data.' : 'Agendamento indisponível no momento.');
        return;
      }
      select.append(...times.map(time => new Option(time, time)));
      select.disabled = false;
      select.dataset.day = day;
      if (times.includes(selectedTime)) select.value = selectedTime;
      setText(status, '');
    } catch {
      if (latest !== pending || field('Day') !== date || date.value !== day) return;
      retry.hidden = false;
      setText(status, 'Não foi possível consultar os horários desta data. Tente novamente.');
    } finally {
      clearTimeout(timeout);
      if (latest === pending) latest = null;
    }
  }

  function selection(type) {
  if (!acceptsWhileClosed() && field('Mode')?.value !== 'later') return null;
  if (!enabled) {
    alert('O agendamento ficou indisponível. Confira o horário do pedido.');
    return false;
  }
  if (!typeSupported(type)) {
    alert('Escolha comer no restaurante, buscar no restaurante, comer no quarto ou balcão para agendar.');
    return false;
  }
  const day = field('Day')?.value;
  const select = field('Time');
  const time = select?.value;
  if (!validDay(day) || day < minimumDay || select?.disabled || select?.dataset.day !== day || !timePattern.test(time || '')) {
    alert('Escolha uma data e um dos horários disponíveis para agendar.');
    return false;
  }
  return {day,time};
}

  function format(value) {
    if (!validDay(value?.day) || typeof value.time !== 'string' || !timePattern.test(value.time)) return '';
    const [year, month, day] = value.day.split('-');
    return `${day}/${month}/${year} às ${value.time}`;
  }

  return { connect, update, render, typeSupported, acceptsWhileClosed, loadSlots, selection, format };
})();

const SeabraPublicCalendar = (() => {
  const actionSelector = [
    'button[data-menu-action]',
    'button[data-skewer-add]',
    'button[onclick="checkout()"]',
    'button[onclick="copyPixCode()"]',
    'button[onclick="pixPaidAndSend()"]'
  ].join(',');
  const dateFormat = new Intl.DateTimeFormat('pt-BR', {
    weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'
  });
  const shifts = { all: 'O restaurante estará fechado', lunch: 'Não haverá atendimento no almoço', dinner: 'Não haverá atendimento no jantar' };
  let root;
  let endpoint;
  let state = 'checking';
  let schedulingEnabled = false;
  let serverNow;
  let nextOpen = null;
  let notice = null;
  let pending = null;
  let checkingCheckout = false;
  let revision = 0;

  function dateFor(day) {
    if (typeof day !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(day)) return null;
    const date = new Date(day + 'T00:00:00Z');
    return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === day ? date : null;
  }

  function validNext(value) {
    return dateFor(value?.day) && typeof value.time === 'string' && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value.time) ? value : null;
  }

  function validNotice(value) {
    return dateFor(value?.day) && Object.hasOwn(shifts, value.shift) ? value : null;
  }

  function nextOpeningText() {
    return nextOpen ? `O atendimento volta ${dateFormat.format(dateFor(nextOpen.day))}, às ${nextOpen.time}.` : '';
  }

  function rejectionMessage() {
    return ['Restaurante fechado para pedidos.', nextOpeningText()].filter(Boolean).join(' ');
  }

  function syncControls() {
    if (!root) return;
    const sheet = document.getElementById('sheet');
    if (!sheet) return;
    const buttons = Array.from(sheet.querySelectorAll(actionSelector));
    SeabraScheduledCheckout.render();
    const scheduledWhileClosed = SeabraScheduledCheckout.acceptsWhileClosed();
    const blocked = state !== 'open' && !scheduledWhileClosed;
    const orderType = sheet.querySelector('#orderType')?.value;
    const blocksCheckout = scheduledWhileClosed && Boolean(sheet.querySelector('#orderType')) && !SeabraScheduledCheckout.typeSupported(orderType);
    const pixIsScheduled = sheet.hasAttribute('data-scheduled-pix-screen') && Boolean(sheet.querySelector('#pixQrCode'));
    const blocksPix = !pixIsScheduled && state !== 'open';
    const pixPresent = Boolean(sheet.querySelector('#pixQrCode'));
    const noteRequired = pixPresent ? blocksPix : blocked || blocksCheckout;
    for (const button of buttons) {
      const action = button.getAttribute('onclick');
      const actionBlocked = action === 'copyPixCode()' || action === 'pixPaidAndSend()' ? blocksPix
        : blocked || (action === 'checkout()' && blocksCheckout);
      if (actionBlocked) {
        if (!button.disabled) button.setAttribute('data-service-disabled', '');
        button.disabled = true;
      } else if (button.hasAttribute('data-service-disabled')) {
        button.removeAttribute('data-service-disabled');
        button.disabled = false;
      }
    }

    const code = sheet.querySelector('#pixQrCode');
    const payload = sheet.querySelector('#pixPayloadText');
    for (const element of [code, code?.previousElementSibling, payload, payload?.previousElementSibling]) {
      element?.classList.toggle('service-calendar-hide-payment', blocksPix);
    }

    let note = sheet.querySelector('.service-calendar-order-note');
    if (!buttons.length || !noteRequired) {
      if (note) note.hidden = true;
      return;
    }
    if (!note) {
      note = document.createElement('p');
      note.className = 'service-calendar-order-note';
      note.setAttribute('role', 'status');
      buttons[0].before(note);
    }
    note.hidden = false;
    const message = state === 'closed' ? rejectionMessage() : state === 'checking' ? 'Consultando horário de atendimento…' : 'O horário de atendimento está indisponível. Volte ao cardápio e toque em “Verificar horário”.';
    const text = blocksCheckout ? 'Escolha uma modalidade válida para agendar: restaurante, retirada, quarto ou balcão.'
      : code && state === 'closed' ? message + ' Se você já fez um Pix, informe o pagamento ao restaurante.' : message;
    if (note.textContent !== text) note.textContent = text;
  }

  function setText(element, value) {
    if (element.textContent !== value) element.textContent = value;
  }

  function render() {
    root.dataset.state = state;
    SeabraScheduledCheckout.update(state, schedulingEnabled, serverNow);
    const titles = {
      checking: 'Consultando horário de atendimento',
      open: 'Aberto para pedidos',
      closed: schedulingEnabled ? 'Fechado agora · pedidos agendados disponíveis' : 'Restaurante fechado para pedidos',
      unavailable: 'Horário de atendimento indisponível'
    };
    const details = {
      checking: 'Você já pode navegar pelo cardápio.',
      open: '',
      closed: [nextOpeningText(), schedulingEnabled ? 'Escolha uma data e um horário para agendar.' : 'O cardápio continua disponível para consulta.'].filter(Boolean).join(' '),
      unavailable: 'Você pode consultar o cardápio enquanto o horário não é confirmado.'
    };
    const detail = root.querySelector('[data-service-detail]');
    setText(root.querySelector('[data-service-title]'), titles[state]);
    setText(detail, details[state]);
    detail.hidden = !details[state];
    const scheduled = root.querySelector('[data-service-notice]');
    setText(scheduled, notice ? `Amanhã, ${dateFormat.format(dateFor(notice.day))}. ${shifts[notice.shift]}.` : '');
    scheduled.hidden = !notice;
    root.querySelector('[data-service-retry]').hidden = state !== 'unavailable';
    syncControls();
  }

  function refresh() {
    if (pending) return pending;
    const request = ++revision;
    const abort = new AbortController();
    const timer = setTimeout(() => abort.abort(), 8000);
    pending = (async () => {
      try {
        const response = await fetch(endpoint, { cache: 'no-store', signal: abort.signal });
        const data = await response.json();
        if (!response.ok || data?.ok !== true || typeof data.open !== 'boolean') throw new Error('Horário indisponível');
        if (request === revision) {
          state = data.open ? 'open' : 'closed';
          schedulingEnabled = data.scheduling_enabled === true;
          serverNow = data.server_now;
          nextOpen = validNext(data.next_open);
          notice = validNotice(data.notice);
          render();
        }
      } catch {
        if (request === revision) {
          state = 'unavailable';
          notice = null;
          render();
        }
      } finally {
        clearTimeout(timer);
        if (request === revision) pending = null;
      }
    })();
    return pending;
  }

  function mount(workerUrl) {
    if (root) return;
    root = document.getElementById('seabraPublicCalendar');
    if (!root) return;
    endpoint = new URL('/service-calendar', workerUrl);
    SeabraScheduledCheckout.connect(workerUrl);
    root.querySelector('[data-service-retry]').addEventListener('click', () => void refresh());
    const sheet = document.getElementById('sheet');
    if (sheet) new MutationObserver(syncControls).observe(sheet, { childList: true, subtree: true });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) void refresh();
    });
    window.addEventListener('online', () => void refresh());
    setInterval(() => { if (!document.hidden) void refresh(); }, 30000);
    render();
    void refresh();
  }

  async function ensureOpen() {
    if (!root || checkingCheckout) return false;
    checkingCheckout = true;
    try {
      await refresh();
    } finally {
      checkingCheckout = false;
    }
    if (state === 'open' || SeabraScheduledCheckout.acceptsWhileClosed()) return true;
    alert(state === 'closed' ? rejectionMessage() : 'Não foi possível confirmar o horário. Confira a conexão e tente novamente.');
    return false;
  }

  function handleRejection(response, data) {
    if (!root || response.status !== 409 || data?.code !== 'SERVICE_CLOSED') return false;
    revision++;
    pending = null;
    state = 'closed';
    nextOpen = validNext(data.next_open);
    render();
    return true;
  }

  return { mount, ensureOpen, handleRejection, rejectionMessage, syncControls };
})();

<script data-seabra-module="origem-e-taxas-f108.js">
'use strict';

const SeabraCheckout = (() => {
  function origin(search) {
    const parameters = new URLSearchParams(search);
    const tables = parameters.getAll('mesa');
    const counters = parameters.getAll('balcao');
    if (!counters.length && tables.length === 1 && /^(?:[1-9]|10)$/.test(tables[0])) {
      return { type: 'Mesa', table: Number(tables[0]), label: 'Mesa ' + tables[0] };
    }
    if (!tables.length && counters.length === 1 && counters[0] === '1') {
      return { type: 'Balcao', label: 'Balcão' };
    }
    return null;
  }

  function hotelCard(search, hash) {
    const parameters = new URLSearchParams(search);
    const source = String(parameters.get('origem') || '').trim().toLowerCase();
    const fragment = String(hash || '').replace(/^#/, '').trim().toLowerCase();
    return ['card-hotel', 'hotel-card'].includes(source) || fragment === 'h';
  }

  function normalized(value) {
    return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  }

  function beverageItem(product, catalog) {
    if (product[5] === 'mercearia') return false;
    const name = normalized(product[0]);
    return name.startsWith('sumo') || Object.entries(catalog).some(([group, entries]) =>
      ['bebidas', 'cafes'].includes(normalized(group)) && entries.some(entry => normalized(entry[0]) === name));
  }

  function kitchenItem(product, catalog) {
    if (product[5] === 'mercearia') return false;
    const name = normalized(product[0]);
    const match = Object.entries(catalog).find(([, products]) =>
      products.some(entry => normalized(entry[0]) === name));
    return !['bebidas', 'cafes', 'mercearia'].includes(normalized(match?.[0])) && !name.startsWith('sumo');
  }

  function unitCount(line) {
    const value = Number(line.quantity);
    return Number.isSafeInteger(value) && value > 0 ? value : 1;
  }

  function cents(value) {
    return Math.max(0, Math.round((Number(value) || 0) * 100));
  }

  function amounts(lines, destination) {
    const type = destination?.type;
    const subtotal = lines.reduce((sum, line) => sum + cents(line.price), 0);
    const packages = ['Retirada', 'Quarto', 'Entrega'].includes(type)
      ? lines.reduce((sum, line) => sum + (line.kitchenItem ? unitCount(line) : 0), 0) : 0;
    const packaging = packages * 200;
    const roomService = type === 'Quarto' && lines.length ? 300 : 0;
    const deliveryFee = type === 'Entrega' ? cents(destination?.freight?.fee) : 0;
    const fees = packaging + roomService + deliveryFee;
    return { subtotal, packages, packaging, roomService, deliveryFee, fees, total: subtotal + fees };
  }

  function feeRows(amount, type, format) {
    const rows = [];
    if (['Retirada','Quarto','Entrega'].includes(type)) {
      rows.push({ label: 'Embalagem (' + amount.packages + ' × ' + format(2) + ' por prato)', cents: amount.packaging });
    }
    if (amount.roomService) rows.push({ label: 'Serviço de quarto', cents: amount.roomService });
    if (amount.deliveryFee) rows.push({ label: 'Frete', cents: amount.deliveryFee });
    return rows;
  }

  function feeMarkup(amount, type, format) {
    return feeRows(amount, type, format).map(row =>
      '<div class="cartline"><span>' + row.label + '</span><b>' + format(row.cents / 100) + '</b></div>').join('');
  }

  function destinationMeta(destination, amount) {
    return {
      ...destination.meta,
      packaging_cents: amount.packaging,
      room_service_cents: amount.roomService,
      delivery_fee_cents: amount.deliveryFee,
    };
  }

  return { origin, hotelCard, kitchenItem, beverageItem, unitCount, amounts, feeRows, feeMarkup, destinationMeta };
})();

      `<option value="${menuExtraHtml(brand+' — '+(type==='zero'?'Zero (sem açúcar)':'Normal (com açúcar)'))}">${menuExtraHtml(brand+' — '+(type==='zero'?'Zero (sem açúcar)':'Normal (com açúcar)'))}</option>`)).join('') : '';
    const flavorChoices = kind === 'suco' ? drinks.juice_flavors.map(flavor => `<option value="${menuExtraHtml(flavor)}">${menuExtraHtml(flavor)}</option>`).join('') : '';
    const specialOptions = kind === 'refri' ? `<div class="menu-paid-extra-options"><label>Marca e tipo<select data-menu-extra-refri><option value="">Escolha uma opção</option>${refriChoices}</select></label></div>` :
      kind === 'suco' ? `<div class="menu-paid-extra-options">${drinks.juice_flavors.length ? `<label>Sabor<select data-menu-extra-flavor><option value="">Escolha o sabor</option>${flavorChoices}</select></label>` : '<span class="small">Sabor a confirmar com o restaurante.</span>'}<div><span>Adicionar leite?</span><span class="choice-grid"><label class="choice-chip"><input type="radio" name="menu-extra-milk-${index}" data-menu-extra-milk value="Não" checked><span>Não</span></label><label class="choice-chip"><input type="radio" name="menu-extra-milk-${index}" data-menu-extra-milk value="Sim"><span>Sim</span></label></span></div></div>` : '';
    const stepper = cents ? `
      <div class="menu-paid-extra-stepper">
        <button type="button" data-menu-extra-step="-1" aria-label="Diminuir ${label}">−</button>
        <input type="number" data-menu-extra-qty min="0" max="20" step="1" value="0" inputmode="numeric" aria-label="Quantidade de ${label}">
        <button type="button" data-menu-extra-step="1" aria-label="Aumentar ${label}">+</button>
      </div>` : '';
    return `<div class="menu-paid-extra-row" data-menu-extra-row="${index}" data-menu-extra-name="${label}" data-menu-extra-cents="${cents}" data-menu-extra-milk-cents="${Number(option.milkFeeCents||0)}" data-menu-extra-kind="${kind}">
      <div class="menu-paid-extra-title"><strong>${label}</strong><small>${cents ? '+' + BRL(cents / 100) + ' por porção' : 'Preço a definir'}</small>${preparation}${specialOptions}</div>${stepper}
    </div>`;
  }).join('');
  return `<section class="menu-paid-extras" data-menu-paid-extras>
    <div class="menu-paid-extra-heading">Extras, bebidas e cafés <span data-menu-extra-subtotal>+${BRL(0)}</span></div>${rows}
    <div class="menu-paid-item-total" role="status"><span>Total do item</span><strong data-menu-extra-total>${BRL(Number(product[1]))}</strong></div></section>`;
}
function menuExtraQuantity(value) {
  const number = Number(value);
  return Number.isFinite(number) ? Math.max(0, Math.min(20, Math.trunc(number))) : 0;
}
function selectedMenuPaidExtras() {
  const extras = sheet.querySelector('[data-menu-paid-extras]');
  let cents = 0;
  const choices = [];
  if (!extras) return {cents, choices};
  const options = menuPaidExtraQuotes.get(extras);
  if (!options) return null;
  for (const row of extras.querySelectorAll('[data-menu-extra-row]')) {
    const quantity = menuExtraQuantity(row.querySelector('[data-menu-extra-qty]')?.value);
    if (!quantity) continue;
    const option = options.get(row.dataset.menuExtraName);
    if (!option?.cents || !isMenuAvailable(option.name)) return null;
    const preparation = option.egg ? row.querySelector('[data-menu-extra-prep]')?.value : '';
    const details = [];
    if (option.kind === 'refri') {
      const refri = row.querySelector('[data-menu-extra-refri]')?.value;
      if (!refri) return null;
      details.push('Refrigerante: ' + refri);
    }
    if (option.kind === 'suco') {
      const flavor = row.querySelector('[data-menu-extra-flavor]')?.value || '';
      if (option.flavors?.length && !flavor) return null;
      if (flavor) details.push('Sabor: ' + flavor);
      const milk = row.querySelector('[data-menu-extra-milk]:checked')?.value || 'Não';
      details.push('Leite: ' + milk);
      if (milk === 'Sim') details.push('taxa +' + BRL(Number(option.milkFeeCents||0) / 100));
    }
    const milk = option.kind === 'suco' && row.querySelector('[data-menu-extra-milk]:checked')?.value === 'Sim' ? Number(option.milkFeeCents||0) : 0;
    const portionTotal = (option.cents + milk) * quantity;
    cents += portionTotal;
    if (preparation) details.push(preparation);
    choices.push(`Extra ${quantity}× ${option.name}${details.length ? ' (' + details.join(' · ') + ')' : ''} (+${BRL(portionTotal / 100)})`);
  }
  return {cents, choices};
}
function bindMenuPaidExtras(product, options) {
  const extras = sheet.querySelector('[data-menu-paid-extras]');
  if (!extras) return;
  menuPaidExtraQuotes.set(extras, new Map(options.map(option => [option.name, option])));
  const subtotal = extras.querySelector('[data-menu-extra-subtotal]');
  const itemTotal = sheet.querySelector('[data-menu-extra-total]');
  const base = Math.round(Number(product[1]) * 100);
  const rows = [...extras.querySelectorAll('[data-menu-extra-row]')];
  function updateTotals() {
    let sum = 0;
    for (const row of rows) {
      const quantity = menuExtraQuantity(row.querySelector('[data-menu-extra-qty]')?.value);
      const preparation = row.querySelector('[data-menu-extra-prep]');
      if (preparation) preparation.hidden = quantity === 0;
      const milk = row.dataset.menuExtraKind === 'suco' && row.querySelector('[data-menu-extra-milk]:checked')?.value === 'Sim' ? Number(row.dataset.menuExtraMilkCents||0) : 0;
      sum += quantity * (Number(row.dataset.menuExtraCents) + milk);
    }
    subtotal.textContent = '+' + BRL(sum / 100);
    itemTotal.textContent = BRL((base + sum) / 100);
  }
  extras.addEventListener('input', updateTotals);
  extras.addEventListener('change', event => {
    if (event.target.matches('[data-menu-extra-qty]')) event.target.value = menuExtraQuantity(event.target.value);
    updateTotals();
  });
  extras.addEventListener('click', event => {
    const button = event.target.closest('[data-menu-extra-step]');
    if (!button) return;
    const input = button.closest('[data-menu-extra-row]').querySelector('[data-menu-extra-qty]');
    input.value = menuExtraQuantity(menuExtraQuantity(input.value) + Number(button.dataset.menuExtraStep));
    updateTotals();
  });
}

function menuItemUsesQuantity(item) {
  return item[4]==='ovo' || ['Bebidas','Cafés','Extras'].some(group=>data[group]?.includes(item));
}

function readMenuItemQuantity(delta=0) {
  const field=document.getElementById('menuItemQuantity');
  if (!field) return 1;
  const chosen=Math.round(Number(field.value)||1)+delta;
  const quantity=Math.min(20,Math.max(1,chosen));
  field.value=String(quantity);
  return quantity;
}

function changeMenuItemQuantity(delta) {
  readMenuItemQuantity(delta);
}

function add(action='more'){
  let x=current;
  const accompChoices=[...sheet.querySelectorAll('input[name="op"]:checked')].map(i=>i.value);
  const point=sheet.querySelector('input[name="ponto"]:checked')?.value||'';
  const prot=sheet.querySelector('input[name="prot"]:checked')?.value||'';
  const marca=sheet.querySelector('input[name="marca"]:checked')?.value||'';
  const tipo=sheet.querySelector('input[name="tipo"]:checked')?.value||'';
  const sabor=sheet.querySelector('input[name="sabor"]:checked')?.value||'';
  const leite=sheet.querySelector('input[name="leite"]:checked')?.value||'Não';

  if(x[0]==='Frango ou Carne à Parmegiana'&&!['Carne','Frango'].includes(prot)){alert('Escolha carne ou frango para a parmegiana.');return}
  if(x[4]==='exec'&&(accompChoices.length<1||accompChoices.length>3)){alert('Escolha de 1 a 3 acompanhamentos incluídos.');return}
  if(x[0]=='Alcatra Acebolada'&&!point){alert('Escolha o ponto da carne.');return}

  if(x[4]=='completao'&&prot==='Carne'&&!point){alert('Escolha o ponto da carne.');return}
  if(x[4]=='ovo'&&!point){alert('Escolha como deseja o ovo.');return}
  if(x[4]=='refri'&&!marca){alert('Escolha o refrigerante.');return}
  if(x[4]=='refri'&&!SeabraMenuConfig.allowedRefriType(drinkSettings,marca,tipo)){alert('Escolha um tipo disponível para esta marca.');return}
  if(x[4]=='suco'&&drinkSettings.juice_flavors.length&&!sabor){alert('Escolha o sabor do suco.');return}

  let choices=[...sheet.querySelectorAll('input:checked')].map(i=>
    x[0]==='Frango ou Carne à Parmegiana'&&i.name==='prot' ? 'Proteína: '+i.value : i.name==='sabor' ? 'Sabor: '+i.value : i.name==='leite' ? 'Leite: '+i.value : i.value||'Batata frita');

      same.quantity=Number(same.quantity||1)+quantity;
      same.price=Math.round(unitPrice*100)*same.quantity/100;
      finishMenuItemAdd(action);return
    }

  cart.push({name:x[0],price:linePrice,unitPrice,quantity,choices,obs,consult,img:firstImg(x[3]),kitchenItem:SeabraCheckout.kitchenItem(x,data),beverage:SeabraCheckout.beverageItem(x,data)});

const seabraWhatsAppConsentPhones = new WeakMap();

const seabraWhatsAppPixForms = new WeakMap();

let seabraWhatsAppPixMode, seabraWhatsAppPixRequest;

function validSeabraWhatsAppNumber(value) {
  const compact = String(value || '').replace(/[\s().-]/g, '');
  return /^(?:\+?55)?[1-9]\d{9,10}$/.test(compact);
}

function loadSeabraWhatsAppPixMode() {
  if (seabraWhatsAppPixRequest) return seabraWhatsAppPixRequest;
  if (seabraWhatsAppPixMode && Date.now() < seabraWhatsAppPixMode.expiresAt) {
    return Promise.resolve(seabraWhatsAppPixMode.automatic);
  }
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4500);
  seabraWhatsAppPixRequest = fetch(PAGBANK_WORKER_URL + '/pix-operacao', {
    cache: 'no-store',
    signal: controller.signal,
  }).then(async response => {
    if (!response.ok) { seabraWhatsAppPixMode=null; return false; }
    const result = await response.json();
    if (typeof result?.automatic !== 'boolean') { seabraWhatsAppPixMode=null; return false; }
    seabraWhatsAppPixMode = { automatic: result.automatic, whatsapp: result.whatsapp===true, expiresAt: Date.now() + 30000 };
    return result.automatic;
  }).catch(() => { seabraWhatsAppPixMode=null; return false; }).finally(() => {
    clearTimeout(timeout);
    seabraWhatsAppPixRequest = null;
  });
  return seabraWhatsAppPixRequest;
}

function setSeabraWhatsAppPayerName(required) {
  const label = document.getElementById('seabraCustomerNameLabel');
  const name = document.getElementById('customerName');
  if (label) label.textContent = required ? 'Nome do pagador *' : 'Nome (opcional)';
  if (name) {
    name.required = required;
    name.placeholder = required ? 'Digite o nome do pagador' : 'Digite o nome, se quiser';
  }
}

function renderSeabraWhatsAppPixForm(form) {
  const active = form.consent.checked && !seabraScheduledRequested();
  const full = active && form.automatic && !form.split.checked;
  form.group.hidden = !active;
  form.group.disabled = !active;
  form.details.hidden = !full;
  form.email.required = full;
  form.tax.required = full;
  if (!full) {
    form.email.value = '';
    form.tax.value = '';
  }
  if (!active) form.split.checked = false;
  setSeabraWhatsAppPayerName(full);
}

async function verifySeabraWhatsAppPixMode() {
  const checkbox = document.getElementById('seabraWhatsAppStatusOptIn');
  const form = seabraWhatsAppPixForms.get(checkbox);
  if (!form || !checkbox.checked || seabraScheduledRequested()) return;
  const approvedPhone = seabraWhatsAppConsentPhones.get(checkbox);
  if (!approvedPhone || approvedPhone !== form.phone.value.trim()) return;
  if (!form.automatic) form.status.hidden = false;
  const automatic = await loadSeabraWhatsAppPixMode();
  if (document.getElementById('seabraWhatsAppStatusOptIn') !== checkbox ||
      !checkbox.checked || seabraWhatsAppConsentPhones.get(checkbox) !== approvedPhone ||
      form.phone.value.trim() !== approvedPhone) return;
  form.status.hidden = true;
  form.automatic = automatic;
  renderSeabraWhatsAppPixForm(form);
}

function seabraWhatsAppPixTaxId(value) {
  const digits = value.trim().replace(/[.\/\s-]/g, '');
  const isCpf = /^\d{11}$/.test(digits);
  if ((!isCpf && !/^\d{14}$/.test(digits)) || /^(\d)\1+$/.test(digits)) return '';
  const input = Array.from(digits, Number);
  const first = isCpf ? 9 : 12;
  for (let length = first; length <= first + 1; length++) {
    const sum = input.slice(0, length).reduce((total, digit, index) => {
      const position = length - index;
      const weight = isCpf ? position + 1 : (position - 1) % 8 + 2;
      return total + digit * weight;
    }, 0);
    const remainder = sum % 11;
    if (input[length] !== (remainder < 2 ? 0 : 11 - remainder)) return '';
  }
  return digits;
}

function bindSeabraWhatsAppConsent(type, box) {
  setSeabraWhatsAppPayerName(false);
  const phoneId = { Quarto: 'roomPhone', Retirada: 'takePhone' }[type];
  if (!phoneId) return;
  const phone = box.querySelector('#' + phoneId);
  const checkbox = box.querySelector('#seabraWhatsAppStatusOptIn');
  const hint = box.querySelector('#seabraWhatsAppStatusHint');
  if (!phone || !checkbox || !hint) return;
  const form = {
    automatic: false,
    consent: checkbox,
    phone,
    status: box.querySelector('#seabraWhatsAppPixStatus'),
    group: box.querySelector('#seabraWhatsAppPixForm'),
    split: box.querySelector('#seabraWhatsAppPixSplit'),
    details: box.querySelector('#seabraWhatsAppPixDetails'),
    email: box.querySelector('#seabraWhatsAppPixEmail'),
    tax: box.querySelector('#seabraWhatsAppPixTax'),
  };
  seabraWhatsAppPixForms.set(checkbox, form);
  checkbox.autocomplete = 'off';
  checkbox.checked = false;

  function syncPhone() {
    const value = phone.value.trim();
    if (seabraWhatsAppConsentPhones.get(checkbox) !== value) {
      checkbox.checked = false;
      seabraWhatsAppConsentPhones.delete(checkbox);
    }
    checkbox.disabled = !validSeabraWhatsAppNumber(value);
    hint.hidden = !checkbox.disabled;
    if (!checkbox.checked) {
      form.status.hidden = true;
      form.automatic = false;
      renderSeabraWhatsAppPixForm(form);
    }
  }

  phone.addEventListener('input', syncPhone);
  phone.addEventListener('change', syncPhone);
  form.split.addEventListener('change', () => renderSeabraWhatsAppPixForm(form));
  checkbox.addEventListener('change', () => {
    if (checkbox.checked && validSeabraWhatsAppNumber(phone.value)) {
      seabraWhatsAppConsentPhones.set(checkbox, phone.value.trim());
    } else {
      seabraWhatsAppConsentPhones.delete(checkbox);
    }
    syncPhone();
    if (checkbox.checked) void verifySeabraWhatsAppPixMode();
  });
  syncPhone();
  const channel = box.querySelector('#seabraWhatsAppStatusChannel');
  if (channel) void loadSeabraWhatsAppPixMode().then(()=>{channel.hidden=seabraWhatsAppPixMode?.whatsapp!==true;});
}

function seabraWhatsAppStatusMeta(phone, rawName) {
  const checkbox = document.getElementById('seabraWhatsAppStatusOptIn');
  if (seabraWhatsAppPixMode?.whatsapp!==true || !checkbox?.checked || seabraWhatsAppConsentPhones.get(checkbox) !== phone) return {};
  const meta = { whatsapp_status_opt_in: true };
  if (seabraScheduledRequested()) return meta;
  const form = seabraWhatsAppPixForms.get(checkbox);
  if (form?.split.checked) return { ...meta, whatsapp_pix_split: true };
  if (!form?.automatic) return meta;
  if (rawName.length < 2 || rawName.length > 120) {
    alert('Informe o nome do pagador para emitir o Pix.');
    return null;
  }
  const email = form.email.value.trim();
  if (email.length < 10 || email.length > 255 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert('Informe um e-mail válido para emitir o Pix.');
    return null;
  }
  const taxId = seabraWhatsAppPixTaxId(form.tax.value);
  if (!taxId) {
    alert('Informe um CPF ou CNPJ válido para emitir o Pix.');
    return null;
  }
  return { ...meta, customer_email: email, customer_tax_id: taxId };
}

async function lookupCEP(){
  const cepEl=document.getElementById('zipCode');
  if(!cepEl) return;
  const cep=(cepEl.value||'').replace(/\D/g,'');
  if(cep.length!==8){
    if(cep.length) setCEPStatus('CEP incompleto. Digite os 8 números ou preencha o endereço manualmente.','#f1b55b');
    return;
  }
  setCEPStatus('Buscando endereço...');
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`,{cache:'no-store'});
    if(!r.ok) throw new Error('Falha na consulta');
    const d=await r.json();
    if(d.erro){
      setCEPStatus('CEP não encontrado. Confira no site dos Correios ou preencha manualmente.','#ff9d8f');
      return;
    }
    const fill=(id,val)=>{const el=document.getElementById(id); if(el && val) el.value=val;};
    fill('street',d.logradouro||'');
    fill('neighborhood',d.bairro||'');
    fill('city',d.localidade||'');
    fill('state',d.uf||'');
    setCEPStatus('Endereço localizado. Confira os dados e informe o número e o complemento, se houver.','#8fd19e');
    setTimeout(()=>document.getElementById('addressNumber')?.focus(),50);
  }catch(e){
    setCEPStatus('Não foi possível consultar agora. Você pode preencher o endereço manualmente ou conferir no site dos Correios.','#ff9d8f');
  }
}

function deliveryAddressData(){

function deliveryAddressKey(a){
  return [a.zip_code,a.street,a.number,a.neighborhood,a.city,a.state,a.complement].map(v=>(v||'').toLowerCase().trim()).join('|');
}
async function calculateFreight(){
  const a=deliveryAddressData();
  if(a.zip_code.length!==8||!a.street||!a.number||!a.city||!a.state){
    const faltando=[];
    if(a.zip_code.length!==8) faltando.push('CEP');
    if(!a.street) faltando.push('rua');
    if(!a.number) faltando.push('número');
    if(!a.city) faltando.push('cidade');
    if(!a.state) faltando.push('UF');
    setFreightStatus('Falta preencher: '+faltando.join(', ')+'.','#ff9d8f');
    return;
  }
  const btn=document.getElementById('freightButton');
  if(btn){btn.disabled=true;btn.textContent='Calculando...';}
  setFreightStatus('Consultando a entrega...');
  deliveryQuote=null;update();
  try{
    const dropoffAddress=[a.street+', '+a.number,a.neighborhood,a.city+' - '+a.state,a.zip_code].filter(Boolean).join(', ');
    const r=await fetch('https://seabra-uber-direct.seabrarestauranteba-27c.workers.dev/quote',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        dropoff:a,
        dropoff_address:dropoffAddress,
        dropoff_structured:{
          street_address:[a.street+', '+a.number,[a.neighborhood,a.complement].filter(Boolean).join(' - ')],
          city:a.city,
          state:a.state,
          zip_code:a.zip_code,
          country:'BR'
        }
      })
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      let msg=d.message||d.erro||d.error||'Não foi possível obter a cotação agora.';
      if(d.status_uber) msg+=` (Uber ${d.status_uber})`;
      if(d.detalhe){
        const det=typeof d.detalhe==='string'?d.detalhe:JSON.stringify(d.detalhe);
        if(det&&det!=='{}') msg+=` — ${det.slice(0,220)}`;
      }
      setFreightStatus(msg,'#ffb38f');
      return;
    }
    const rawFee=d.fee_cents??d.fee??d.amount??d.price;
    const feeNumber=Number(rawFee);
    if(!Number.isFinite(feeNumber)||feeNumber<=0){
      setFreightStatus('A Uber respondeu, mas não retornou um valor de frete válido. Tente novamente.','#ffb38f');
      return;
    }
    const feeBRL=(d.fee_cents!=null || (Number.isInteger(feeNumber)&&feeNumber>=100)) ? feeNumber/100 : feeNumber;
    deliveryQuote={
      fee:feeBRL,
      currency:d.currency||'BRL',
      quote_id:d.quote_id||d.id||'',
      expires:d.expires||d.expires_at||'',
      duration:d.duration||d.duration_minutes||null,
      addressKey:deliveryAddressKey(a),
      source:d.source||'uber_direct'
    };
    let extra=deliveryQuote.duration?` • previsão aproximada: ${deliveryQuote.duration} min`:'';
    if(d.source==='fallback') extra+=' • valor de contingência';
    setFreightStatus(`Frete: ${BRL(deliveryQuote.fee)}${extra}.`, '#8fd19e');
    update();
  }catch(e){
    setFreightStatus('A cotação automática não respondeu. O pedido poderá seguir com o frete a confirmar pelo restaurante.','#ffb38f');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Calcular frete';}
  }
}
function deliveryFreightFor(a){
  if(!deliveryQuote) return null;
  if(deliveryQuote.addressKey!==deliveryAddressKey(a)) return null;
  return deliveryQuote;
}

async function scheduledPixRequestId(payload) {
  const {weather, duplicate_confirmation, ...stable} = payload;
  const bytes = new TextEncoder().encode(JSON.stringify(stable));
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  const fingerprint = Array.from(hash, byte=>byte.toString(16).padStart(2,'0')).join('');
  if (!duplicate_confirmation && seabraScheduledRequest?.fingerprint === fingerprint && seabraRequestUuid.test(seabraScheduledRequest.id)) return seabraScheduledRequest.id;
  const id = crypto.randomUUID();
  if (!duplicate_confirmation) {
    seabraScheduledRequest = {fingerprint,id};
    writeScheduledPixSession(seabraScheduledRequestKey,seabraScheduledRequest);
  }
  return id;
}

async function submitScheduledPix(dest, allowDuplicate=false) {
  if (seabraScheduledSubmitBusy) return;
  if (!validSeabraWhatsAppNumber(dest.phone)) {
    alert('Informe um telefone de contato válido com DDD.');
    const phone = document.getElementById(dest.type === 'Quarto' ? 'roomPhone' : 'takePhone');
    phone?.focus();
    return;
  }
  if (cart.some(item=>item.consult)) {
    alert('Remova do carrinho os itens com preço a confirmar para agendar e pagar por Pix.');
    return;
  }
  const amounts = SeabraCheckout.amounts(cart,dest);
  if (!cart.length || amounts.total <= 0) {
    alert('Adicione ao carrinho itens com preço definido antes de agendar.');
    return;
  }
  const lines = cart.slice();
  const button = document.getElementById('seabraMainCheckout');
  seabraScheduledSubmitBusy = true;
  if (button) { button.disabled = true; button.textContent = 'Gerando Pix…'; }
  try {
    const order = await submitOrderFast(dest,'Pix',lines,{allowDuplicate});
    const payment = order.payment;
    const schedule = SeabraScheduledCheckout.format(order.scheduled_for);
    const number = Number(order.general_number);
    const quoteMatches = payment?.amount_cents === amounts.total && payment.subtotal_cents === amounts.subtotal &&
      payment.packaging_cents === amounts.packaging && payment.room_service_cents === amounts.roomService;
    const validPendingCode = payment?.status === 'pendente' && typeof payment.pix_code === 'string' &&
      /^000201[!-~]{20,490}$/.test(payment.pix_code);
    if (order.scheduled_pix_required !== true || payment?.method !== 'Pix' || !quoteMatches ||
        !Number.isSafeInteger(number) || number <= 0 || !schedule || !(payment.status === 'pago' || validPendingCode)) {
      throw Error('O código Pix do agendamento não ficou disponível. Atualize o cardápio e tente novamente.');
    }
    seabraScheduledTicket = {amounts,type:dest.type,schedule,status:payment.status,code:payment.pix_code,
      qrImage:payment.qr_image,number:String(number).padStart(3,'0'),whatsapp_start_ref:order.whatsapp_start_ref||''};
    writeScheduledPixSession(seabraScheduledTicketKey,seabraScheduledTicket);
    seabraScheduledRequest = null;
    writeScheduledPixSession(seabraScheduledRequestKey,null);
    const originalLines = new Set(lines);
    cart = cart.filter(line=>!originalLines.has(line));
    update();
    showScheduledPixPayment();
  } catch (error) {
    if (error?.code==='DUPLICATE_PENDING' && !allowDuplicate) {

        seabraScheduledSubmitBusy=false;
        return submitScheduledPix(dest,true);

      return;

    alert(error?.name === 'AbortError' ? 'O servidor demorou. Tente novamente com os mesmos dados para recuperar o Pix.' :
      error?.message || 'Não foi possível gerar o Pix do agendamento. Tente novamente.');
  } finally {
    seabraScheduledSubmitBusy = false;
    if (button?.isConnected) button.disabled = false;
    SeabraPublicCalendar.syncControls();
  }
}

function pixTLV(id,value){
  value=String(value);
  return id+String(value.length).padStart(2,'0')+value;
}
function pixNormalize(value,max){
  return String(value||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9 .-]/g,'')
    .toUpperCase().trim().slice(0,max);
}
function pixCRC16(payload){
  let crc=0xFFFF;
  for(let i=0;i<payload.length;i++){
    crc^=payload.charCodeAt(i)<<8;
    for(let j=0;j<8;j++) crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);
    crc&=0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function generatePixPayload(amount){
  const merchantAccount=pixTLV('00','BR.GOV.BCB.PIX')+pixTLV('01',PIX_KEY);
  const additional=pixTLV('05','***');
  let payload='';
  payload+=pixTLV('00','01');
  payload+=pixTLV('26',merchantAccount);
  payload+=pixTLV('52','0000');
  payload+=pixTLV('53','986');
  payload+=pixTLV('54',Number(amount).toFixed(2));
  payload+=pixTLV('58','BR');
  payload+=pixTLV('59',pixNormalize(PIX_MERCHANT_NAME,25));
  payload+=pixTLV('60',pixNormalize(PIX_MERCHANT_CITY,15));
  payload+=pixTLV('62',additional);
  payload+='6304';
  return payload+pixCRC16(payload);
}

  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Bahia',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value||'';

function weatherLabel(code){const m={0:'Céu limpo',1:'Predominantemente limpo',2:'Parcialmente nublado',3:'Nublado',45:'Neblina',48:'Neblina',51:'Garoa leve',53:'Garoa',55:'Garoa forte',61:'Chuva leve',63:'Chuva',65:'Chuva forte',80:'Pancadas leves',81:'Pancadas',82:'Pancadas fortes',95:'Trovoada'};return m[Number(code)]||'Condição não classificada'}
async function captureWeather(){try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,weather_code&timezone=America%2FBahia`;const r=await fetch(u);const d=await r.json();if(!r.ok||!d.current)return null;return {temperature:Number(d.current.temperature_2m),code:Number(d.current.weather_code),condition:weatherLabel(d.current.weather_code),captured_at:d.current.time||''}}catch(e){return null}}
let lastCapturedWeather=null;
async function ensureWeather(){
  if(lastCapturedWeather)return lastCapturedWeather;
  try{lastCapturedWeather=await Promise.race([captureWeather(),new Promise(r=>setTimeout(()=>r(null),900))])}catch(e){lastCapturedWeather=null}
  return lastCapturedWeather;
}
function prefetchWeather(){if(!lastCapturedWeather)captureWeather().then(x=>{if(x)lastCapturedWeather=x}).catch(()=>{})}

async function pagBankOrderPayload(dest,order=null){
  const amounts=SeabraCheckout.amounts(cart,dest);
  const referenceId=order?`SEABRA-${order.day.replace(/-/g,'')}-${orderPad(order.general_number)}`:'SEABRA-'+Date.now();

  const weather=await ensureWeather();
  return {
    reference_id: referenceId,
    weather,
    fiscal:dest.fiscal||{requested:false,data:{}},
    restaurant: 'Seabra Restaurante',
    order_identity: order?{day:order.day,general_number:order.general_number,origin_number:order.origin_number,origin_type:order.origin_type,origin_code:order.origin_code,created_at_local:order.created_at_local}:null,
    customer: {name: dest.name, phone: dest.phone||''},
    destination: {
      type: dest.type,
      details: dest.details,
      address: dest.address || null, meta: seabraDestinationMetaForSubmit(dest,amounts)
    },
    items: cart.map((x,i)=>({
      ...SeabraSkewers.orderFields(x),
      reference_id: String(i+1),
      name: x.name,
      image:firstImg(x.img||''),
      kitchen_item:!!x.kitchenItem,
      description: [
        x.choices && x.choices.length ? 'Opções: '+x.choices.join(', ') : '',
        x.obs ? 'Obs.: '+x.obs : ''
      ].filter(Boolean).join(' | '),
      quantity: Math.max(1,Number(x.quantity||1)),
      unit_amount: Math.round(Number(x.unitPrice!=null?x.unitPrice:(Number(x.price||0)/Math.max(1,Number(x.quantity||1))))*100)
    })),
    subtotal_cents: amounts.subtotal,
    freight_cents: amounts.fees,
    total_cents: amounts.total,
    currency: 'BRL',
    return_url: window.location.origin + window.location.pathname + '?pagamento=retorno',
    notification_url_hint: 'pagbank-webhook'
  };
}

async function payWithPagBank(dest,order){
  if(dest.type==='Entrega'&&!dest.freight){
    alert('Para pagar com cartão, calcule primeiro o frete para que o PagBank receba o valor total correto.');
    return;
  }
  if(!cart.length){
    alert('Seu carrinho está vazio.');
    return;
  }

  const btns=[...document.querySelectorAll('button')];
  const continueBtn=btns.find(b=>b.textContent.trim()==='Continuar pedido');
  const originalText=continueBtn?.textContent || '';
  if(continueBtn){
    continueBtn.disabled=true;
    continueBtn.textContent='Abrindo PagBank...';
  }

  try{
    const response=await fetch(PAGBANK_WORKER_URL+'/checkout',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(await pagBankOrderPayload(dest,order))
    });

    const data=await response.json().catch(()=>({}));

    if(!response.ok || !data.ok){
      throw new Error(data.message || data.erro || 'Não foi possível iniciar o pagamento no PagBank.');
    }

    const paymentUrl =
      data.payment_url ||
      data.checkout_url ||
      data.url ||
      (Array.isArray(data.links)
        ? (data.links.find(l=>String(l.rel||'').toUpperCase()==='PAY')?.href || '')
        : '');

    if(!paymentUrl){
      throw new Error('O PagBank não devolveu o link de pagamento.');
    }

    savePendingPagBankOrder(order,dest);
    window.location.href=paymentUrl;
  }catch(error){
    alert('Pagamento por cartão indisponível no momento. '+(error?.message||'Tente novamente.'));
  }finally{
    if(continueBtn){
      continueBtn.disabled=false;
      continueBtn.textContent=originalText || 'Continuar pedido';
    }
  }
}

async function checkout(){
  if (seabraScheduledSubmitBusy || !await SeabraPublicCalendar.ensureOpen()) return;
  const selectedType=document.getElementById('orderType')?.value||'';
  const selectedPay=document.querySelector('input[name="pay"]:checked')?.value||'';
  if(selectedType==='Entrega'){
    alert('Entrega fora do restaurante está temporariamente indisponível.');
    return;
  }
  if(selectedPay==='Cartão PagBank'){
    alert('Pagamento por cartão via PagBank está temporariamente indisponível.');
    return;
  }

  if (!seabraScheduledRequested()) await verifySeabraWhatsAppPixMode();
  const fiscalReq=getFiscalRequest();if(fiscalReq===null)return;
  let p=document.querySelector('input[name=pay]:checked')?.value||'Pagamento na entrega';
  let dest=getOrderDestination();
  if(!dest) return;
  dest.fiscal=fiscalReq;
  const scheduled=SeabraScheduledCheckout.selection(dest.type);
  if(scheduled===false) return;
  if(scheduled){dest.scheduled_for=scheduled;await submitScheduledPix(dest);return;}

  if((p==='Pix direto'||p==='Cartão PagBank')&&cart.some(x=>x.consult)){
    alert('Há item com disponibilidade e valor a confirmar no carrinho. Para pagar online, aguarde a confirmação do restaurante ou remova esse item.');
    return;
  }

  if(p==='Pix direto'){
    if(dest.type==='Entrega'&&!dest.freight){
      alert('Para pagar por Pix, calcule primeiro o frete para que o QR Code seja gerado com o valor total correto.');
      return;
    }
    showPixPayment(dest);
    return;
  }

  if(p==='Cartão PagBank'){
    if(dest.type==='Entrega'&&!dest.freight){
      alert('Para pagar com cartão, calcule primeiro o frete para que o PagBank receba o valor total correto.');
      return;
    }
    try{
      const order=await reserveOrderIdentity(dest);
      await payWithPagBank(dest,order);
    }catch(error){
      alert('Não foi possível numerar o pedido. '+(error?.message||'Tente novamente.'));
    }
    return;
  }

  if(dest.type==='Entrega'&&!dest.freight){
    const ok=confirm('O frete ainda não foi calculado. Deseja enviar o pedido mesmo assim para o restaurante confirmar o valor da entrega pelo WhatsApp?');
    if(!ok) return;
  }
  await sendWhats(p,dest);
}


async function submitOrderFast(dest,pay,lines=cart,options={}){
  if(ORDER_SEQUENCE_DEMO)return demoOrderIdentity(dest);
  const amounts=SeabraCheckout.amounts(lines,dest);
  const payload={
    ...(dest.scheduled_for ? {scheduled_for:dest.scheduled_for} : {}),
    customer:{name:dest.name,phone:dest.phone||''},
    destination:{type:dest.type,details:dest.details,address:dest.address||null,meta:seabraDestinationMetaForSubmit(dest,amounts)},
    items:lines.map((x,i)=>({...SeabraSkewers.orderFields(x),reference_id:String(i+1),image:x.img||'',name:x.name,kitchen_item:!!x.kitchenItem,beverage:!!x.beverage,description:[x.choices&&x.choices.length?'Opções: '+x.choices.join(', '):'',x.obs?'Obs.: '+x.obs:''].filter(Boolean).join(' | '),quantity:Math.max(1,Number(x.quantity||1)),unit_amount:Math.round(Number(x.unitPrice!=null?x.unitPrice:(Number(x.price||0)/Math.max(1,Number(x.quantity||1))))*100)})),
    subtotal_cents:amounts.subtotal,
    freight_cents:amounts.fees,
    total_cents:amounts.total,
    fiscal:dest.fiscal||getFiscalRequest()||{requested:false,data:{}},
    payment_method:pay,
    ...(options.allowDuplicate===true ? {duplicate_confirmation:true} : {})
  };
  if(dest.scheduled_for) payload.scheduled_request_id=await scheduledPixRequestId(payload);
  payload.weather=await ensureWeather();
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);
  try{
    const response=await fetch(PAGBANK_WORKER_URL+'/submit-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});
    const data=await response.json().catch(()=>({}));
    if(dest.scheduled_for && response.status===409) void SeabraScheduledCheckout.loadSlots();
    if(SeabraPublicCalendar.handleRejection(response,data)) throw new Error(SeabraPublicCalendar.rejectionMessage());
    if(!response.ok||!data.ok){
      const error=new Error(data.erro||'Não foi possível registrar o pedido.');
      error.code=data.code||'';
      error.existing_order=data.existing_order||null;
      throw error;
    }
    return data;
  }finally{clearTimeout(timer)}
}

async function sendWhats(pay='Pagamento na entrega',dest=null,order=null,options={}){
  if(!dest){dest=getOrderDestination();if(!dest)return}
  const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('Continuar pedido'));
  const old=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='Confirmando...'}
  try{
    const identity=order||await submitOrderFast(dest,pay,cart,{allowDuplicate:options.allowDuplicate===true});
    const t=seabraWhatsAppOrderMessage(buildWhatsText(pay,dest,identity),dest,identity);
    showOrderConfirmation(identity,dest,pay,t,'Pedido registrado no painel interno do restaurante.');
    seabraTryOpenOrderWhatsApp(t,dest,identity);
  }catch(error){
    if(error?.code==='DUPLICATE_PENDING' && options.allowDuplicate!==true){
      const previous=error.existing_order;
      const when=previous?.created_at_local ? ` (${previous.created_at_local})` : '';
      if(confirm(`Já existe um pedido idêntico em produção${when}. Deseja pedir outro mesmo assim?`)) {
        if(btn){btn.disabled=false;btn.textContent=old||'Continuar pedido'}
        return sendWhats(pay,dest,order,{allowDuplicate:true});
      }
      return;
    }
    const msg=error?.name==='AbortError'?'O servidor demorou além do esperado. Aguarde alguns segundos e tente novamente.':(error?.message||'Tente novamente.');
    alert('Não foi possível confirmar o pedido. '+msg);
  }finally{
    if(btn){btn.disabled=false;btn.textContent=old||'Continuar pedido'}
    SeabraPublicCalendar.syncControls();
  }
}
